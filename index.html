<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operation Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121410;
    --surface: #1B1E15;
    --surface-2: #23271B;
    --line: #34392A;
    --text: #ECE7D8;
    --muted: #8B8F79;
    --individual: #C1652F;
    --individual-dim: #6E3C22;
    --group: #8AAE6F;
    --group-dim: #4C5F3E;
    --gold: #D8B65C;
    --danger: #A5432A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(138,174,111,0.06), transparent 45%),
      radial-gradient(ellipse at bottom right, rgba(193,101,47,0.06), transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    padding: 20px 14px 60px;
  }
  .wrap{ max-width: 920px; margin: 0 auto; }

  /* ---------- HERO ---------- */
  .hero{
    border: 1px solid var(--line);
    background: linear-gradient(180deg, var(--surface), var(--surface-2));
    padding: 22px 20px 20px;
    position: relative;
    overflow: hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 14px);
    pointer-events:none;
  }
  .eyebrow{
    font-size: 11px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase;
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;
  }
  .hero-main{ display:flex; align-items:center; gap: 22px; flex-wrap: wrap; justify-content: space-between; }
  h1.title{
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(34px, 6vw, 54px);
    line-height: 0.95;
    letter-spacing: 1px;
    margin: 0;
    text-transform: uppercase;
    color: var(--text);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
  }
  .title .u{ text-decoration: underline; text-decoration-thickness: 4px; text-underline-offset: 6px; text-decoration-color: var(--individual); }
  .subtitle{ color: var(--muted); font-size: 12px; margin-top: 8px; letter-spacing:0.5px; }

  /* ---------- RING ---------- */
  .ring-wrap{ position: relative; width: 108px; height:108px; flex-shrink:0; }
  .ring-wrap svg{ transform: rotate(-90deg); width:100%; height:100%; }
  .ring-track{ fill:none; stroke: var(--line); stroke-width: 8; }
  .ring-fill{ fill:none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
  .ring-label{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .ring-pct{ font-family:'Anton', sans-serif; font-size: 22px; letter-spacing:0.5px; }
  .ring-cap{ font-size: 8px; color: var(--muted); letter-spacing:2px; text-transform:uppercase; margin-top:1px;}
  .ring-tick{ position:absolute; width:2px; height:6px; background:var(--muted); opacity:0.5; }

  /* ---------- SECTION LABELS ---------- */
  .section-head{
    display:flex; align-items:baseline; gap:10px; margin: 30px 0 12px;
    padding-bottom:8px; border-bottom: 1px solid var(--line);
  }
  .section-head h2{
    font-family:'Anton', sans-serif; font-weight:400; text-transform:uppercase;
    font-size: 20px; letter-spacing:1px; margin:0;
  }
  .section-head .tag{ font-size:10px; color: var(--bg); background: var(--muted); padding:2px 7px; letter-spacing:1.5px; }
  .section-head.group .tag{ background: var(--group); }
  .section-head.individual .tag{ background: var(--individual); }
  .section-note{ font-size: 11px; color: var(--muted); margin-left:auto; }

  /* ---------- ROSTER ---------- */
  .roster{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(96px,1fr)); gap:10px;
  }
  .roster-card{
    background: var(--surface); border:1px solid var(--line); padding: 12px 8px 10px;
    display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer;
    transition: border-color 0.15s, transform 0.1s;
  }
  .roster-card:hover{ border-color: var(--individual); }
  .roster-card.active{ border-color: var(--individual); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--individual); }
  .roster-ring{ width:64px; height:64px; position:relative; }
  .roster-name{ font-size: 11px; letter-spacing:1.5px; text-transform:uppercase; text-align:center; }
  .roster-frac{ font-size:9px; color:var(--muted); }

  /* ---------- PANEL / ACTIVITY LIST ---------- */
  .panel{ background: var(--surface); border:1px solid var(--line); padding: 4px; }
  .activity{
    display:flex; align-items:center; gap:12px; padding: 13px 12px;
    border-bottom:1px solid var(--line);
  }
  .activity:last-child{ border-bottom:none; }
  .activity.done{ background: rgba(138,174,111,0.05); }
  .badge{
    width:26px; height:26px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:14px; border:1px solid var(--line); background: var(--surface-2);
  }
  .activity-body{ flex:1; min-width:0; }
  .activity-label{ font-size: 13px; letter-spacing:0.3px; }
  .activity.done .activity-label{ color: var(--group); }
  .bar-track{ height:5px; background: var(--surface-2); margin-top:7px; border:1px solid var(--line); overflow:hidden;}
  .bar-fill{ height:100%; background: var(--individual); transition: width 0.35s ease; }
  .section-head.group ~ .panel .bar-fill{ background: var(--group); }
  .activity-meta{ font-size:10px; color: var(--muted); margin-top:4px; letter-spacing:0.5px; }

  .controls{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .btn{
    background: var(--surface-2); border:1px solid var(--line); color: var(--text);
    width:28px; height:28px; font-size:16px; cursor:pointer; font-family:'IBM Plex Mono', monospace;
    display:flex; align-items:center; justify-content:center; user-select:none;
  }
  .btn:hover{ border-color: var(--individual); color: var(--individual); }
  .group .btn:hover{ border-color: var(--group); color: var(--group); }
  .num-input{
    width: 56px; background: var(--surface-2); border:1px solid var(--line); color:var(--text);
    text-align:center; font-family:'IBM Plex Mono', monospace; font-size:12px; padding:5px 2px;
  }
  .check-btn{
    width:30px; height:30px; border:1px solid var(--line); background: var(--surface-2);
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px; color: var(--muted);
  }
  .check-btn.on{ background: var(--group-dim); border-color: var(--group); color: var(--group); }

  .group-item .badge{ background: var(--group-dim); border-color: var(--group); }
  .group-item.done{ background: rgba(138,174,111,0.08); }

  footer{ text-align:center; margin-top: 34px; color: var(--muted); font-size:10px; letter-spacing:1.5px; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); }

  @media (max-width:480px){
    .hero-main{ flex-direction: column; align-items:flex-start; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div style="text-align:center; padding:60px 0; color:var(--muted); font-size:12px; letter-spacing:2px;" id="loading">LOADING BOARD&hellip;</div>
</div>

<script>
const PEOPLE = ["Carter","Christian","Jack","James","Blake","Lucas","Connor"];

const INDIVIDUAL = [
  { id:"miles",     label:"10 miles",              icon:"🏃", type:"count", target:10,   step:1,   unit:"mi" },
  { id:"pushups",   label:"1000 pushups",          icon:"💪", type:"count", target:1000, step:50,  unit:"reps" },
  { id:"driving",   label:"Driving hour",          icon:"🚗", type:"check" },
  { id:"fish",      label:"Catch a fish",          icon:"🎣", type:"check" },
  { id:"milk",      label:"Milk through the day",  icon:"🥛", type:"check" },
  { id:"pizza",     label:"Pizza through the day", icon:"🍕", type:"check" },
  { id:"chip",      label:"1 Chip Challenge",      icon:"🌶️", type:"check" },
  { id:"halfcourt", label:"Half-court shot made",  icon:"🏀", type:"check" },
];

const GROUP = [
  { id:"crossbars", label:"50 crossbars",           type:"count", target:50,   step:5,   unit:"" },
  { id:"beatmc",    label:"Beat MC (3 hrs)",         type:"check" },
  { id:"mario",     label:"Mario Inside (2 hrs)",    type:"check" },
  { id:"juggles",   label:"5000 group juggles",      type:"count", target:5000, step:250, unit:"" },
  { id:"fortnite",  label:"Fortnite 90 min",         type:"check" },
  { id:"brawl",     label:"500 group brawl kills",   type:"count", target:500,  step:25,  unit:"" },
  { id:"wavelength",label:"25 wavelength games",     type:"count", target:25,   step:1,   unit:"" },
  { id:"puzzle",    label:"1000-piece puzzle",       type:"check" },
];

// ---- Backend config: fill these in from your Supabase project ----
// Settings > API in your Supabase dashboard.
const SUPABASE_URL = "https://zsskwundeeybwapnhhqv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpzc2t3dW5kZWV5YndhcG5oaHF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNTE1MTAsImV4cCI6MjEwMTcyNzUxMH0.vBQAgVxWlSlBsW0TxbM2de9Tbbv1OWeKxDXAwDTXu1M";
// Run this once in the Supabase SQL editor before first use:
//
// create table board_state (
//   id text primary key,
//   data jsonb not null
// );
// alter table board_state enable row level security;
// create policy "public read" on board_state for select using (true);
// create policy "public write" on board_state for insert with check (true);
// create policy "public update" on board_state for update using (true);
// --------------------------------------------------------------------

let state = null;
let activePerson = PEOPLE[0];
let saveTimer = null;

function defaultState(){
  const individual = {};
  PEOPLE.forEach(p=>{
    individual[p] = {};
    INDIVIDUAL.forEach(a=>{ individual[p][a.id] = 0; });
  });
  const group = {};
  GROUP.forEach(a=>{ group[a.id] = 0; });
  return { individual, group };
}

const sbHeaders = {
  apikey: SUPABASE_ANON_KEY,
  Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
  'Content-Type': 'application/json',
};

function backfillState(){
  PEOPLE.forEach(p=>{
    if(!state.individual[p]) state.individual[p] = {};
    INDIVIDUAL.forEach(a=>{ if(!(a.id in state.individual[p])) state.individual[p][a.id] = 0; });
  });
  GROUP.forEach(a=>{ if(!(a.id in state.group)) state.group[a.id] = 0; });
}

async function loadState(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/board_state?id=eq.main&select=data`, { headers: sbHeaders });
    const rows = await res.json();
    if(Array.isArray(rows) && rows.length && rows[0].data){
      state = rows[0].data;
    } else {
      state = defaultState();
      await saveState(); // seed the row on first-ever load
    }
  }catch(e){
    console.error('load failed, using local defaults', e);
    state = defaultState();
  }
  backfillState();
}

async function saveState(){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/board_state`, {
      method: 'POST',
      headers: { ...sbHeaders, Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify([{ id: 'main', data: state }]),
    });
  }catch(e){ console.error('save failed', e); }
}

function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 200);
}

// Light polling so everyone's screen reflects everyone else's taps.
// Skipped while someone is mid-typing in a number field.
setInterval(async ()=>{
  if(document.activeElement && document.activeElement.classList.contains('num-input')) return;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/board_state?id=eq.main&select=data`, { headers: sbHeaders });
    const rows = await res.json();
    if(Array.isArray(rows) && rows.length && rows[0].data){
      state = rows[0].data;
      backfillState();
      render();
    }
  }catch(e){ /* silent - keep last known state */ }
}, 4000);

function ratio(act, val){
  if(act.type === 'check') return val >= 1 ? 1 : 0;
  return Math.min(1, val / act.target);
}

function personPct(p){
  const sum = INDIVIDUAL.reduce((s,a)=> s + ratio(a, state.individual[p][a.id]), 0);
  return Math.round((sum / INDIVIDUAL.length) * 100);
}

function groupPct(){
  const sum = GROUP.reduce((s,a)=> s + ratio(a, state.group[a.id]), 0);
  return Math.round((sum / GROUP.length) * 100);
}

function overallPct(){
  let sum = 0, count = 0;
  PEOPLE.forEach(p=>{
    INDIVIDUAL.forEach(a=>{ sum += ratio(a, state.individual[p][a.id]); count++; });
  });
  GROUP.forEach(a=>{ sum += ratio(a, state.group[a.id]); count++; });
  return Math.round((sum/count)*100);
}

function ringSVG(pct, color, size, strokeW, extraClass=""){
  const r = (size/2) - strokeW;
  const c = 2*Math.PI*r;
  const offset = c - (pct/100)*c;
  return `
    <svg viewBox="0 0 ${size} ${size}" class="${extraClass}">
      <circle class="ring-track" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${strokeW}"></circle>
      <circle class="ring-fill" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${strokeW}"
        stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
    </svg>`;
}

function render(){
  const app = document.getElementById('app');
  const oPct = overallPct();
  const gPct = groupPct();

  let html = `
  <div class="hero">
    <div class="eyebrow"><span>OPERATION BOARD &middot; ${PEOPLE.length} ON ROSTER</span><span>AUG 8</span></div>
    <div class="hero-main">
      <div>
        <h1 class="title"><span class="u">10 miles</span> 2 hours</h1>
        <div class="subtitle">RULES OF ENGAGEMENT &mdash; 🪦 marked tasks are GROUP objectives, everything else every soldier clears alone.</div>
      </div>
      <div class="ring-wrap" title="Overall completion">
        ${ringSVG(oPct, 'var(--gold)', 108, 8)}
        <div class="ring-label">
          <div class="ring-pct">${oPct}%</div>
          <div class="ring-cap">Overall</div>
        </div>
      </div>
    </div>
  </div>

  <div class="section-head individual">
    <h2>Squad Roster</h2>
    <span class="tag">Individual</span>
    <span class="section-note">tap a name</span>
  </div>
  <div class="roster">
  `;

  PEOPLE.forEach(p=>{
    const pct = personPct(p);
    const doneCount = INDIVIDUAL.filter(a=> ratio(a, state.individual[p][a.id]) >= 1).length;
    html += `
      <div class="roster-card ${p===activePerson ? 'active':''}" data-person="${p}">
        <div class="roster-ring">
          ${ringSVG(pct, 'var(--individual)', 64, 6)}
          <div class="ring-label"><div class="ring-pct" style="font-size:15px">${pct}%</div></div>
        </div>
        <div class="roster-name">${p}</div>
        <div class="roster-frac">${doneCount}/${INDIVIDUAL.length}</div>
      </div>`;
  });

  html += `</div>`;

  html += `
  <div class="section-head individual">
    <h2>${activePerson}'s Orders</h2>
    <span class="tag">Individual</span>
  </div>
  <div class="panel">`;

  INDIVIDUAL.forEach(a=>{
    const val = state.individual[activePerson][a.id];
    const r = ratio(a, val);
    const isDone = r >= 1;
    html += `<div class="activity ${isDone?'done':''}">
      <div class="badge">${a.icon}</div>
      <div class="activity-body">
        <div class="activity-label">${a.label}</div>`;
    if(a.type === 'count'){
      html += `
        <div class="bar-track"><div class="bar-fill" style="width:${r*100}%; background: var(--individual);"></div></div>
        <div class="activity-meta">${val} / ${a.target} ${a.unit}</div>`;
    }
    html += `</div><div class="controls">`;
    if(a.type === 'count'){
      html += `
        <button class="btn" data-act="dec" data-scope="ind" data-id="${a.id}">&minus;</button>
        <input class="num-input" type="number" min="0" data-input="ind" data-id="${a.id}" value="${val}">
        <button class="btn" data-act="inc" data-scope="ind" data-id="${a.id}">+</button>`;
    } else {
      html += `<button class="check-btn ${isDone?'on':''}" data-act="toggle" data-scope="ind" data-id="${a.id}">${isDone?'&#10003;':''}</button>`;
    }
    html += `</div></div>`;
  });

  html += `</div>`;

  html += `
  <div class="section-head group">
    <h2>Group Objectives</h2>
    <span class="tag">🪦 Group</span>
    <span class="section-note">${gPct}% cleared</span>
  </div>
  <div class="panel group">`;

  GROUP.forEach(a=>{
    const val = state.group[a.id];
    const r = ratio(a, val);
    const isDone = r >= 1;
    html += `<div class="activity group-item ${isDone?'done':''}">
      <div class="badge">🪦</div>
      <div class="activity-body">
        <div class="activity-label">${a.label}</div>`;
    if(a.type === 'count'){
      html += `
        <div class="bar-track"><div class="bar-fill" style="width:${r*100}%; background: var(--group);"></div></div>
        <div class="activity-meta">${val} / ${a.target} ${a.unit}</div>`;
    }
    html += `</div><div class="controls">`;
    if(a.type === 'count'){
      html += `
        <button class="btn" data-act="dec" data-scope="grp" data-id="${a.id}">&minus;</button>
        <input class="num-input" type="number" min="0" data-input="grp" data-id="${a.id}" value="${val}">
        <button class="btn" data-act="inc" data-scope="grp" data-id="${a.id}">+</button>`;
    } else {
      html += `<button class="check-btn ${isDone?'on':''}" data-act="toggle" data-scope="grp" data-id="${a.id}">${isDone?'&#10003;':''}</button>`;
    }
    html += `</div></div>`;
  });

  html += `</div>
  <footer>SHARED BOARD &middot; CHANGES SYNC FOR EVERYONE</footer>`;

  app.innerHTML = html;
  attachHandlers();
}

function getActDef(scope, id){
  return scope === 'ind' ? INDIVIDUAL.find(a=>a.id===id) : GROUP.find(a=>a.id===id);
}

function setVal(scope, id, newVal){
  const a = getActDef(scope, id);
  newVal = Math.max(0, newVal);
  if(a.type === 'count') newVal = Math.min(newVal, a.target * 1.0);
  if(scope === 'ind'){
    state.individual[activePerson][id] = newVal;
  } else {
    state.group[id] = newVal;
  }
  queueSave();
  render();
}

function attachHandlers(){
  document.querySelectorAll('.roster-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      activePerson = el.dataset.person;
      render();
    });
  });

  document.querySelectorAll('[data-act="inc"], [data-act="dec"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const scope = el.dataset.scope, id = el.dataset.id;
      const a = getActDef(scope, id);
      const cur = scope==='ind' ? state.individual[activePerson][id] : state.group[id];
      const delta = el.dataset.act === 'inc' ? a.step : -a.step;
      setVal(scope, id, cur + delta);
    });
  });

  document.querySelectorAll('[data-act="toggle"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const scope = el.dataset.scope, id = el.dataset.id;
      const cur = scope==='ind' ? state.individual[activePerson][id] : state.group[id];
      setVal(scope, id, cur >= 1 ? 0 : 1);
    });
  });

  document.querySelectorAll('.num-input').forEach(el=>{
    el.addEventListener('change', ()=>{
      const scope = el.dataset.input, id = el.dataset.id;
      let v = parseFloat(el.value);
      if(isNaN(v)) v = 0;
      setVal(scope, id, v);
    });
  });
}

(async function init(){
  await loadState();
  render();
})();
</script>
</body>
</html>
